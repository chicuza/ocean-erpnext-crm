name: Tornar pacote publico

# OBJETIVO
# Testar, empiricamente, se o GITHUB_TOKEN do Actions (com packages: write)
# consegue alterar a visibilidade do pacote GHCR para "public".
#
# POR QUE ISSO IMPORTA
# O design oficial do frappe_docker exige que os 4 servicos (backend, frontend,
# worker, scheduler) rodem A MESMA imagem — senao o backend gera HTML com um hash
# de asset e o frontend serve outro, quebrando o Desk.
# A imagem unica ja existe: ghcr.io/chicuza/ocean-erpnext-crm:production
# Falta apenas ela ser puxavel pelo Railway. Railway so aceita registry PRIVADO
# no plano Pro e com configuracao pela UI; com o pacote PUBLICO, nao precisa de nada.
#
# MEDIDO em 2026-08-11 com o PAT pessoal (escopos: admin:public_key, gist, read:org,
# repo, workflow — SEM packages):
#   PATCH /user/packages/container/ocean-erpnext-crm  -> 404
# O 404 pode ser rota inexistente OU falta de escopo (o GitHub devolve 404 para
# ocultar existencia). Este workflow desambigua usando um token COM escopo.

on:
  workflow_dispatch:

jobs:
  set-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Tentar tornar publico (varias rotas candidatas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PKG=ocean-erpnext-crm
          OWNER=${{ github.repository_owner }}

          echo "=== rota 1: PATCH /user/packages/container/PKG ==="
          curl -s -o /tmp/r1 -w "HTTP %{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/user/packages/container/$PKG"
          head -c 300 /tmp/r1; echo

          echo "=== rota 2: PATCH /users/OWNER/packages/container/PKG ==="
          curl -s -o /tmp/r2 -w "HTTP %{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/users/$OWNER/packages/container/$PKG"
          head -c 300 /tmp/r2; echo

          echo "=== leitura: o token do Actions ao menos LE o pacote? ==="
          curl -s -o /tmp/r3 -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/$PKG"
          head -c 300 /tmp/r3; echo

          echo "=== teste final: pull anonimo funciona? ==="
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:$OWNER/$PKG:pull&service=ghcr.io" | jq -r '.token // empty')
          if [ -n "$TOKEN" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$OWNER/$PKG/manifests/production")
            echo "manifest anonimo -> HTTP $code"
            [ "$code" = "200" ] && echo "RESULTADO: PACOTE PUBLICO" || echo "RESULTADO: ainda privado"
          else
            echo "RESULTADO: ainda privado (sem token anonimo)"
          fi
